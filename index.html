<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>BinaryThrottle</title>
  <meta name="description" content="BinaryThrottle — coming soon.">
  <meta name="color-scheme" content="dark light">
  <style>
    :root {
      --bg: #0b0d10;
      --fg: #e6e6e6;
      --muted: #8a8f98;
      --accent: #ff6b35;
      --border: #1d2025;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fafafa;
        --fg: #1a1a1a;
        --muted: #666;
        --accent: #ff6b35;
        --border: #e5e5e5;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main {
      max-width: 36rem;
      width: 100%;
      text-align: left;
    }
    .mark {
      display: inline-block;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      padding: 0.25rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      margin-bottom: 2rem;
    }
    .mark .dot {
      display: inline-block;
      width: 0.5rem;
      height: 0.5rem;
      background: var(--accent);
      border-radius: 50%;
      margin-right: 0.5rem;
      vertical-align: 0.1rem;
    }
    p.coming-soon {
      color: var(--accent);
      font-weight: 600;
      font-size: 0.875rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0;
    }
    .pages {
      position: fixed;
      z-index: 1;
      top: max(0.75rem, env(safe-area-inset-top));
      right: max(0.75rem, env(safe-area-inset-right));
    }
    .pages:not([open]) nav { display: none; }
    .pages summary {
      list-style: none;
      cursor: pointer;
      width: 2.75rem;
      height: 2.75rem;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1;
      border-radius: 999px;
    }
    .pages summary::-webkit-details-marker { display: none; }
    .pages summary::marker { content: ""; }
    .pages summary:hover,
    .pages[open] summary { color: var(--accent); }
    .pages summary:focus-visible,
    .pages a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .pages nav {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 0.15rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.35rem;
      min-width: 11.5rem;
    }
    .pages ul { list-style: none; }
    .pages a {
      color: var(--fg);
      text-decoration: none;
      display: flex;
      align-items: center;
      min-height: 2.75rem;
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      font-size: 0.875rem;
    }
    .pages a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <details class="pages">
    <summary aria-label="Pages"><span aria-hidden="true">π</span></summary>
    <nav aria-label="Pages">
      <ul>
        <li><a href="/camperpower">Camper Power</a></li>
        <li><a href="/wledremote">WLED Remote</a></li>
      </ul>
    </nav>
  </details>
  <main>
    <div class="mark"><span class="dot"></span>BinaryThrottle</div>
    <p class="coming-soon">Website Coming Soon</p>
  </main>
</body>
</html>
