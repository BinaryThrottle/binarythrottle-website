<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BinaryThrottle</title>
  <meta name="description" content="BinaryThrottle — short, sharp, ship.">
  <meta name="color-scheme" content="dark light">
  <style>
    :root {
      --bg: #0b0d10;
      --fg: #e6e6e6;
      --muted: #8a8f98;
      --accent: #ff6b35;
      --border: #1d2025;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fafafa;
        --fg: #1a1a1a;
        --muted: #666;
        --accent: #ff6b35;
        --border: #e5e5e5;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main {
      max-width: 36rem;
      width: 100%;
      text-align: left;
    }
    .mark {
      display: inline-block;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      padding: 0.25rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      margin-bottom: 2rem;
    }
    .mark .dot {
      display: inline-block;
      width: 0.5rem;
      height: 0.5rem;
      background: var(--accent);
      border-radius: 50%;
      margin-right: 0.5rem;
      vertical-align: 0.1rem;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 1rem;
    }
    h1 .accent { color: var(--accent); }
    p.tagline {
      color: var(--muted);
      font-size: 1.125rem;
      margin-bottom: 2.5rem;
    }
    ul.links {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    ul.links a {
      color: var(--fg);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    ul.links a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    footer {
      margin-top: 3rem;
      color: var(--muted);
      font-size: 0.875rem;
    }
    code {
      font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.875em;
      background: rgba(127,127,127,0.1);
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark"><span class="dot"></span>BinaryThrottle</div>
    <h1>Short. Sharp.<br><span class="accent">Ship.</span></h1>
    <p class="tagline">Build fast, ship faster. Built on Vercel, deployed from Git.</p>
    <ul class="links">
      <li><a href="https://github.com/BinaryThrottle">GitHub</a></li>
      <li><a href="https://vercel.com">Deployed on Vercel</a></li>
    </ul>
    <footer>
      <code>index.html</code> · no build step · auto-deploys on push to <code>main</code>
    </footer>
  </main>
</body>
</html>
