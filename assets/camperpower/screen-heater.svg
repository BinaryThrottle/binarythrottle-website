  <g fill="#e8e3d3"><rect x="94" y="230" width="3" height="12"/><rect x="109" y="230" width="3" height="12"/><rect x="94" y="248" width="3" height="12"/><rect x="109" y="248" width="3" height="12"/></g>
  <text x="0" y="0" transform="translate(98 470) rotate(-90)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#8d6a00">PLACEHOLDER RENDER</text>
