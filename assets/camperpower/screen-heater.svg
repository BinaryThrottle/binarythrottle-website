    <circle cx="76" cy="524" r="15"/><circle cx="884" cy="524" r="15"/>
  </g>
  <g fill="#141414"><circle cx="76" cy="76" r="8"/><circle cx="884" cy="76" r="8"/><circle cx="76" cy="524" r="8"/><circle cx="884" cy="524" r="8"/></g>
