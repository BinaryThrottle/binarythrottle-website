  <rect x="50" y="50" width="860" height="500" rx="16" fill="url(#pcb)"/>
  <rect x="50" y="50" width="860" height="500" rx="16" fill="url(#sheen)"/>
  <g fill="none" stroke="#c99600" stroke-width="2.5" stroke-linecap="round" opacity=".7">
